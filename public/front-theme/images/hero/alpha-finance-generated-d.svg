      <path d="M84 30l1.8 3.8 4.2.6-3 3 .7 4.2-3.7-2-3.7 2 .7-4.2-3-3 4.2-.6z"/>
      <path d="M72 62l2 4.1 4.6.7-3.3 3.3.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.3 4.6-.7z"/>
      <path d="M40 75l2.3 4.8 5.3.8-3.8 3.8.9 5.3L40 87.7l-4.7 2.7.9-5.3-3.8-3.8 5.3-.8z"/>
      <path d="M0 78l2.6 5.2 5.8.9-4.2 4.1 1 5.8L0 91.2-5.2 94l1-5.8-4.2-4.1 5.8-.9z"/>
