<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="52%" stop-color="#0a1b2e"/>
      <stop offset="100%" stop-color="#0a4f7f"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1360 230) rotate(136) scale(820 520)">
      <stop stop-color="#36b6f1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#36b6f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(370 860) rotate(8) scale(560 250)">
      <stop stop-color="#b79652" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#b79652" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd3ff"/>
      <stop offset="100%" stop-color="#24a7e6"/>
    </linearGradient>
    <linearGradient id="lineGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7545"/>
      <stop offset="55%" stop-color="#c2a163"/>
      <stop offset="100%" stop-color="#8f7545"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>

