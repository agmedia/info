    <path d="M140 0V1080M310 0V1080M480 0V1080M650 0V1080M820 0V1080M990 0V1080M1160 0V1080M1330 0V1080M1500 0V1080M1670 0V1080M1840 0V1080"/>
  </g>

  <!-- finance bars -->
  <g>
    <rect x="360" y="610" width="42" height="220" rx="7" fill="#46c8ff" fill-opacity="0.62"/>
    <rect x="430" y="540" width="42" height="290" rx="7" fill="#46c8ff" fill-opacity="0.68"/>
    <rect x="500" y="660" width="42" height="170" rx="7" fill="#46c8ff" fill-opacity="0.52"/>
