  <!-- data curves -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 730C240 680 290 700 390 650C490 600 560 690 650 640C740 590 810 660 900 610C980 565 1060 620 1140 575C1230 525 1310 560 1400 510C1500 455 1600 490 1800 400" stroke="url(#lineBlue)" stroke-width="7"/>
    <path d="M120 780C220 760 300 810 420 760C520 715 620 770 730 730C850 685 930 740 1030 700C1140 655 1240 710 1360 670C1480 625 1600 650 1800 610" stroke="url(#lineGold)" stroke-width="4"/>
    <path d="M120 760C240 700 290 720 390 670C490 620 560 710 650 660C740 610 810 680 900 630C980 585 1060 640 1140 595C1230 545 1310 580 1400 530C1500 475 1600 510 1800 420" stroke="#46c8ff" stroke-opacity="0.5" stroke-width="14" filter="url(#blurSoft)"/>
  </g>

  <!-- audit/certainty pulses -->
