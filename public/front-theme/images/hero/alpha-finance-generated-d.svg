    <rect x="1070" y="610" width="42" height="220" rx="7" fill="#46c8ff" fill-opacity="0.58"/>
    <rect x="1430" y="520" width="42" height="310" rx="7" fill="#46c8ff" fill-opacity="0.66"/>
    <rect x="1500" y="450" width="42" height="380" rx="7" fill="#46c8ff" fill-opacity="0.76"/>
    <rect x="1570" y="590" width="42" height="240" rx="7" fill="#46c8ff" fill-opacity="0.58"/>
