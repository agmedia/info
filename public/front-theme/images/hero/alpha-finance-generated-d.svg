      <path d="M-72 62l2 4.1 4.6.7-3.3 3.3.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.3 4.6-.7z"/>
      <path d="M-84 30l1.8 3.8 4.2.6-3 3 .7 4.2-3.7-2-3.7 2 .7-4.2-3-3 4.2-.6z"/>
      <path d="M-72 -2l2 4.1 4.6.7-3.3 3.3.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.3 4.6-.7z"/>
