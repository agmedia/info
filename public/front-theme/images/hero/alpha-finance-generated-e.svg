<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="54%" stop-color="#0a1727"/>
      <stop offset="100%" stop-color="#0b3d61"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1430 210) rotate(136) scale(760 520)">
      <stop stop-color="#2f8bc2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f8bc2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 860) rotate(8) scale(520 220)">
      <stop stop-color="#b79652" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#b79652" stop-opacity="0"/>
    </radialGradient>
    <pattern id="etchGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#9bc8e4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="etchBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bc9f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4db8e7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="etchGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7545" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c2a163" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8f7545" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#etchGrid)"/>

  <!-- etched finance contours (subtle) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 760C220 734 292 748 390 712C486 678 566 726 654 694C742 662 818 706 910 672C1002 638 1084 676 1180 638C1276 600 1364 624 1454 592C1542 562 1646 574 1810 528" stroke="url(#etchBlue)" stroke-width="3"/>
    <path d="M110 796C224 780 302 812 402 782C504 750 586 790 676 760C768 730 850 766 944 738C1038 708 1122 742 1218 712C1316 682 1402 700 1496 676C1592 652 1688 662 1810 636" stroke="url(#etchGold)" stroke-width="2.1"/>
    <path d="M110 826C230 816 312 836 416 816C516 796 598 824 692 804C786 784 872 810 968 790C1062 770 1150 792 1244 772C1338 752 1430 764 1524 748C1618 732 1706 736 1810 724" stroke="url(#etchBlue)" stroke-width="1.4"/>
  </g>

  <!-- subtle bars, etched style -->
  <g opacity="0.26">
    <rect x="370" y="626" width="18" height="178" rx="4" fill="#6ac8ef"/>
    <rect x="405" y="588" width="18" height="216" rx="4" fill="#6ac8ef"/>
    <rect x="440" y="648" width="18" height="156" rx="4" fill="#6ac8ef"/>

    <rect x="930" y="612" width="18" height="192" rx="4" fill="#6ac8ef"/>
    <rect x="965" y="566" width="18" height="238" rx="4" fill="#6ac8ef"/>
    <rect x="1000" y="640" width="18" height="164" rx="4" fill="#6ac8ef"/>

    <rect x="1460" y="596" width="18" height="208" rx="4" fill="#6ac8ef"/>
    <rect x="1495" y="542" width="18" height="262" rx="4" fill="#6ac8ef"/>
    <rect x="1530" y="630" width="18" height="174" rx="4" fill="#6ac8ef"/>
  </g>

  <!-- audit / trust rings -->
  <g fill="none" stroke="#b79652" stroke-opacity="0.22">
    <circle cx="1470" cy="618" r="146" stroke-width="1"/>
    <circle cx="1470" cy="618" r="226" stroke-width="0.8"/>
    <circle cx="1470" cy="618" r="304" stroke-width="0.7"/>
  </g>

  <!-- EU cue: geometric 12-point orbital marks, not stars -->
  <g transform="translate(240 268)" opacity="0.24" fill="#d2b06f">
    <circle cx="0" cy="-82" r="2.6"/>
    <circle cx="41" cy="-71" r="2.6"/>
    <circle cx="71" cy="-41" r="2.6"/>
    <circle cx="82" cy="0" r="2.6"/>
    <circle cx="71" cy="41" r="2.6"/>
    <circle cx="41" cy="71" r="2.6"/>
    <circle cx="0" cy="82" r="2.6"/>
    <circle cx="-41" cy="71" r="2.6"/>
    <circle cx="-71" cy="41" r="2.6"/>
    <circle cx="-82" cy="0" r="2.6"/>
    <circle cx="-71" cy="-41" r="2.6"/>
    <circle cx="-41" cy="-71" r="2.6"/>
  </g>

  <rect x="0" y="0" width="1920" height="1.5" fill="#b79652" fill-opacity="0.45"/>
</svg>
