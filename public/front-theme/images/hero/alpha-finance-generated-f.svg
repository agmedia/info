      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="46%" stop-color="#0A1728"/>
      <stop offset="100%" stop-color="#0C466E"/>
    </linearGradient>
    <radialGradient id="mistA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1410 230) rotate(135) scale(820 560)">
      <stop stop-color="#43B3EA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#43B3EA" stop-opacity="0"/>
