<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020612"/>
      <stop offset="48%" stop-color="#051A33"/>
      <stop offset="100%" stop-color="#0A3F66"/>
    </linearGradient>

    <radialGradient id="blueAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1540 210) rotate(142) scale(900 560)">
      <stop stop-color="#5FD0FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5FD0FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="barStroke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5CCDF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A6F0FF" stop-opacity="0.46"/>
    </linearGradient>

    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5CCDF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#87E7FF" stop-opacity="0.26"/>
    </linearGradient>

    <linearGradient id="dottedLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65D4FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#90EAFF" stop-opacity="0.54"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EDBFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#B2F2FF" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-25%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="lower">
      <rect x="0" y="0" width="1920" height="1080"/>
    </clipPath>
    <linearGradient id="dataFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="34%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="white" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="dataMask">
      <rect x="0" y="0" width="1920" height="1080" fill="url(#dataFade)"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#blueAura)"/>

  <!-- pixel grid blocks like reference -->
  <g opacity="0.07" fill="#5FA9E0">
    <rect x="120" y="88" width="38" height="38"/><rect x="176" y="88" width="38" height="38"/>
    <rect x="354" y="124" width="38" height="38"/><rect x="410" y="124" width="38" height="38"/>
    <rect x="620" y="94" width="38" height="38"/><rect x="676" y="94" width="38" height="38"/>
    <rect x="838" y="142" width="38" height="38"/><rect x="894" y="142" width="38" height="38"/>
    <rect x="1056" y="100" width="38" height="38"/><rect x="1112" y="100" width="38" height="38"/>
    <rect x="1280" y="136" width="38" height="38"/><rect x="1336" y="136" width="38" height="38"/>
    <rect x="1502" y="108" width="38" height="38"/><rect x="1558" y="108" width="38" height="38"/>
    <rect x="1700" y="156" width="38" height="38"/><rect x="1756" y="156" width="38" height="38"/>
    <rect x="258" y="250" width="36" height="36"/><rect x="312" y="250" width="36" height="36"/>
    <rect x="540" y="270" width="36" height="36"/><rect x="594" y="270" width="36" height="36"/>
    <rect x="822" y="246" width="36" height="36"/><rect x="876" y="246" width="36" height="36"/>
    <rect x="1108" y="276" width="36" height="36"/><rect x="1162" y="276" width="36" height="36"/>
    <rect x="1394" y="252" width="36" height="36"/><rect x="1448" y="252" width="36" height="36"/>
    <rect x="1664" y="284" width="36" height="36"/><rect x="1718" y="284" width="36" height="36"/>
  </g>

  <g opacity="0.06" stroke="#88C9EA" stroke-width="1">
    <path d="M0 210H1920M0 370H1920M0 530H1920M0 690H1920M0 850H1920"/>
    <path d="M140 0V1080M340 0V1080M540 0V1080M740 0V1080M940 0V1080M1140 0V1080M1340 0V1080M1540 0V1080M1740 0V1080"/>
  </g>

  <!-- subtle reduced skyline -->
    <path d="M0 900L160 900L160 852L210 852L210 900L330 900L330 828L390 828L390 900L512 900L512 786L556 786L556 900L700 900L700 812L750 812L750 900L906 900L906 774L946 774L946 900L1124 900L1124 820L1170 820L1170 900L1358 900L1358 794L1404 794L1404 900L1586 900L1586 744L1616 744L1616 690L1634 690L1634 744L1670 744L1670 900L1920 900L1920 1080L0 1080Z" fill="#061626" opacity="0.1"/>

  <g clip-path="url(#lower)" mask="url(#dataMask)">
    <!-- bars -->
    <g opacity="0.58">
      <rect x="140" y="928" width="26" height="152" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="250" y="898" width="26" height="182" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="360" y="860" width="26" height="220" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="470" y="812" width="26" height="268" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="580" y="744" width="26" height="336" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="690" y="676" width="26" height="404" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="800" y="602" width="26" height="478" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="910" y="534" width="26" height="546" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="1020" y="466" width="26" height="614" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="1130" y="396" width="26" height="684" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="1240" y="322" width="26" height="758" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2"/>
      <rect x="1350" y="252" width="26" height="828" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2" opacity="0.82"/>
      <rect x="1460" y="186" width="26" height="894" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2" opacity="0.74"/>
      <rect x="1570" y="118" width="26" height="962" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2" opacity="0.66"/>
      <rect x="1680" y="64" width="26" height="1016" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2" opacity="0.56"/>
      <rect x="1790" y="30" width="26" height="1050" rx="8" fill="url(#barFill)" stroke="url(#barStroke)" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- dotted / secondary lines -->
    <path d="M0 1010L150 1002L300 968L450 988L600 930L760 768L920 812L1080 776L1240 834L1400 576L1580 522L1740 238L1880 96" stroke="url(#dottedLine)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" fill="none" filter="url(#glow)"/>
    <path d="M0 1070L180 1010L320 1044L470 960L620 1016L790 920L950 860L1120 650L1310 590L1470 620L1660 570L1780 432" stroke="url(#accentLine)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.58"/>

    <!-- main growth arrow removed per direction -->
  </g>

  <rect x="0" y="0" width="1920" height="1.5" fill="#B79652" fill-opacity="0.34"/>
</svg>
